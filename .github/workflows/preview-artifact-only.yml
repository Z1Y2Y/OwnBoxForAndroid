name: PreviewRelease Artifact Only

on:
  push:
    branches:
      - "fix/mybox-route-semantics-*"

permissions:
  contents: read

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build and Verify PreviewRelease APK
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download LibCore AAR
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Build signed PreviewRelease and run unit tests
        env:
          BUILD_PLUGIN: none
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          fi
          if [ ! -f "release.keystore" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Release signing credentials missing; refusing to build an unsigned PreviewRelease."
            exit 1
          fi
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> local.properties
          echo "ALIAS_NAME=$ALIAS_NAME" >> local.properties
          echo "ALIAS_PASS=$ALIAS_PASS" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          init_complete=false
          for attempt in 1 2 3; do
            echo "Initializing build assets (attempt $attempt/3)."
            if ./run init action gradle; then
              init_complete=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "Asset initialization failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          if [ "$init_complete" != true ]; then
            echo "::error::Asset initialization failed after 3 attempts."
            exit 1
          fi
          ./gradlew app:testPreviewReleaseUnitTest
          ./gradlew app:assemblePreviewRelease

          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -n 1)
          if [ -n "$APK" ]; then
            APK_DIR=$(dirname "$APK")
          else
            APK_DIR="app/build/outputs/apk/preview/release"
          fi
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "::error::Android build tools are incomplete; refusing to upload unverified APKs."
            exit 1
          fi

          shopt -s nullglob
          for apk in "$APK_DIR"/*-unsigned.apk; do
            signed_apk="${apk%-unsigned.apk}-signed.apk"
            echo "Signing $apk -> $signed_apk"
            "$APKSIGNER" sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:${ALIAS_PASS:-$KEYSTORE_PASS}" --ks-key-alias "${ALIAS_NAME:-ownbox}" --out "$signed_apk" "$apk"
            rm "$apk"
          done

          EXPECTED_CERT_SHA256="a9094d2fa0f54b4f35bbf9e86feb7a9a419b832894b21ef45bdcaff7838616bf"
          APK_COUNT=0
          FIRST_CERT=""
          for apk in "$APK_DIR"/*.apk; do
            APK_COUNT=$((APK_COUNT + 1))
            "$APKSIGNER" verify --verbose "$apk"
            cert_output=$("$APKSIGNER" verify --print-certs "$apk" 2>&1)
            cert=$(printf '%s\n' "$cert_output" | awk 'tolower($0) ~ /certificate sha-256 digest/ { sub(/^.*digest:[[:space:]]*/, ""); gsub(/[^[:xdigit:]]/, ""); print tolower($0); exit }')
            if [[ ! "$cert" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Could not read a valid signing certificate fingerprint for $apk."
              exit 1
            fi
            if [ -z "$FIRST_CERT" ]; then
              FIRST_CERT="$cert"
            elif [ "$cert" != "$FIRST_CERT" ]; then
              echo "::error::APK set contains inconsistent signing certificates."
              exit 1
            fi
            if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::APK signing certificate does not match the existing PreviewRelease signer."
              exit 1
            fi
            badging=$("$AAPT" dump badging "$apk" | sed -n '1p')
            package=$(printf '%s\n' "$badging" | sed -n "s/.*package: name='\\([^']*\\)'.*/\\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")
            if [ "$package" != "com.ownbox.fork" ]; then
              echo "::error::Unexpected APK package ($package); expected com.ownbox.fork."
              exit 1
            fi
            if ! [[ "$version_code" =~ ^[0-9]+$ ]] || [ "$version_code" -le 2340 ]; then
              echo "::error::APK versionCode must be greater than 2340 (actual=$version_code)."
              exit 1
            fi
            echo "Verified APK: $apk (package=$package versionCode=$version_code signerSHA256=$cert)"
          done
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APKs found in $APK_DIR."
            exit 1
          fi
          rm -f release.keystore
          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBox-PreviewRelease-26.11.3.69
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 14
